<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-primary">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Dating App</a>
    @let currentUser = accountService.currentUser$ | async; 
    
    @if (currentUser === null) {
    <form #loginForm="ngForm" class="d-flex" (ngSubmit)="login()">
      <input
        name="username"
        [(ngModel)]="model.username"
        class="form-control me-2"
        type="text"
        placeholder="Username"
        autocomplete="username"
      />
      <input
        name="password"
        [(ngModel)]="model.password"
        class="form-control me-2"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />
      <button class="btn btn-success" type="submit">Login</button>
    </form>
    } @else {
    <ul class="navbar-nav me-auto mb-2 mb-md-0">
      <li class="nav-item">
        <a class="nav-link" routerLink="/members" routerLinkActive="active"
          >Matches</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/lists" routerLinkActive="active"
          >Lists</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/messages" routerLinkActive="active"
          >Messages</a
        >
      </li>
    </ul>

    <div class="dropdown" dropdown>
      <img src="{{currentUser.photoUrl || '/assets/user.png'}}" alt="{{currentUser.photoUrl}}" />
      <a class="dropdown-toggle text-light text-decoration-none" dropdownToggle
        >Welcome {{currentUser.knownAs | titlecase}}</a
      >
      <div class="dropdown-menu mt-3" *dropdownMenu>
        <a class="dropdown-item" routerLink="/member/edit">Edit Profile</a>
        <div class="dropdown-divider"></div>
        <a href="" class="dropdown-item" (click)="logout()">Logout</a>
      </div>
    </div>
    }
  </div>
</nav>
